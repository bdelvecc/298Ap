name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install --yes iverilog

      - name: Run ALU tests
        run: |
          iverilog -g2012 -Wall -s tb_alu -o /tmp/sim_alu src/alu.v test/tb_alu.v
          vvp /tmp/sim_alu

      - name: Run register file tests
        run: |
          iverilog -g2012 -Wall -s tb_regfile -o /tmp/sim_regfile src/register_file.v test/tb_regfile.v
          vvp /tmp/sim_regfile
