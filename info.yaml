# Tiny Tapeout project information
project:
  title:        "298A"      # Project title
  author:       "Mohammad-Reza Riahi-Fard (morirf)"      # Your name
  discord:      "mori12345"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "298A project"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000000  # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_bdelvecc"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "alu.v"
    - "register_file.v"
    - "control.v"
    - "pc.v"
    - "datapath.v"
    - "stack.v"
    - "cpu.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "Instruction bit 0"
  ui[1]: "Instruction bit 1"
  ui[2]: "Instruction bit 2"
  ui[3]: "Instruction bit 3"
  ui[4]: "Instruction bit 4"
  ui[5]: "Instruction bit 5"
  ui[6]: "Instruction bit 6"
  ui[7]: "Instruction bit 7"

  # Outputs
  uo[0]: "Output bit 0"
  uo[1]: "Output bit 1"
  uo[2]: "Output bit 2"
  uo[3]: "Output bit 3"
  uo[4]: "Output bit 4"
  uo[5]: "Output bit 5"
  uo[6]: "Output bit 6"
  uo[7]: "Output bit 7"

  # Bidirectional pins
  uio[0]: "Program counter bit 0"
  uio[1]: "Program counter bit 1"
  uio[2]: "Program counter bit 2"
  uio[3]: "Program counter bit 3"
  uio[4]: "Program counter bit 4"
  uio[5]: "Program counter bit 5"
  uio[6]: "Step (input)"
  uio[7]: "Output valid"

# Do not change!
yaml_version: 6
